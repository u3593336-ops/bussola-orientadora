<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bússola Orientadora</title>
    
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800&display=swap" rel="stylesheet">
    
    <style>
        /* Variáveis de Cores e Estética */
        :root {
            --vidro-borda: rgba(255, 255, 255, 0.3);
            --vidro-brilho: rgba(255, 255, 255, 0.15);
            --sombra-3d: 0 10px 30px rgba(0, 0, 0, 0.5);
            --amarelo-titulo: #FFD700;
        }

        /* Configuração Base (Tela Cheia Imersiva) */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: #fff;
            min-height: 100vh;
            background-color: #0F172A; /* Fundo escuro de segurança */
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Fundo Travado: Anti-bug no iOS e adaptação Paisagem/Retrato */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('fundo-bussola-blur-desktop.png') center/cover no-repeat;
            z-index: -1;
        }

        @media (max-aspect-ratio: 1/1) {
            body::before {
                background: url('fundo-bussola-blur-mobile.png') center/cover no-repeat;
            }
        }

        /* Container Principal */
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Título Flutuante 3D */
        .titulo-principal {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(2.5rem, 6vw, 4.5rem);
            font-weight: 800;
            text-align: center;
            color: #FFFFFF;
            text-shadow: 0px 8px 16px rgba(0, 0, 0, 0.6), 0px -2px 4px rgba(255, 255, 255, 0.3);
            margin: 40px 0;
            letter-spacing: 1px;
        }

        /* === NÍVEL 1: TELA INICIAL (BOTÕES CÁPSULA) === */
        .menu-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            width: 100%;
        }

        .btn-capsula {
            width: 100%;
            max-width: 450px;
            padding: 18px 24px;
            border-radius: 50px;
            background: linear-gradient(180deg, rgba(30, 100, 150, 0.85) 0%, rgba(15, 60, 100, 0.95) 100%);
            border: 1px solid var(--vidro-borda);
            border-top: 2px solid rgba(255, 255, 255, 0.4); /* Efeito luz de vidro */
            color: #fff;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: var(--sombra-3d);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            cursor: pointer;
            transition: transform 0.2s ease, filter 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .btn-capsula:hover, .btn-capsula:active {
            transform: scale(1.03);
            filter: brightness(1.2);
        }

        .btn-capsula.emergencia {
            background: linear-gradient(180deg, rgba(180, 40, 50, 0.85) 0%, rgba(120, 20, 30, 0.95) 100%);
            margin-bottom: 10px;
        }

        /* === NÍVEL 2: TELA DE CARDS === */
        .secao-titulo {
            font-family: 'Outfit', sans-serif;
            text-align: center;
            color: var(--amarelo-titulo);
            font-size: 2rem;
            margin-bottom: 30px;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            width: 100%;
        }

        .card-vidro {
            background: rgba(20, 30, 45, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            border: 1px solid var(--vidro-borda);
            border-top: 1px solid rgba(255,255,255,0.4);
            box-shadow: var(--sombra-3d);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s;
            display: flex;
            flex-direction: column;
        }

        .card-vidro:hover, .card-vidro:active {
            transform: translateY(-8px);
        }

        .card-topo {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(0,0,0,0.2));
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .card-conteudo { padding: 20px; }

        .card-titulo {
            font-family: 'Outfit', sans-serif;
            color: var(--amarelo-titulo);
            font-size: 1.4rem;
            margin-bottom: 10px;
        }

        .card-resumo {
            font-size: 0.95rem;
            color: #E2E8F0;
            line-height: 1.5;
        }

        /* === NÍVEL 3: TELA DE DETALHES (INFORMAÇÃO COMPLETA) === */
        .detalhes-container { width: 100%; max-width: 800px; margin: 0 auto; }

        .caixa-principal {
            background: rgba(13, 71, 161, 0.85); /* Azul vibrante estilo Circuito BH */
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid var(--vidro-borda);
            border-top: 2px solid rgba(255, 255, 255, 0.4);
            box-shadow: var(--sombra-3d);
            margin-bottom: 24px;
        }

        .caixa-principal h2 {
            font-family: 'Outfit', sans-serif;
            color: #FFF;
            margin-bottom: 16px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .caixa-principal p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #F1F5F9;
        }

        /* Botões Cápsula Expansíveis (Verdes e Azuis) */
        .pilula-container { margin-bottom: 16px; }

        .pilula-btn {
            width: 100%;
            background: linear-gradient(90deg, rgba(46, 125, 50, 0.9) 0%, rgba(27, 94, 32, 0.95) 100%); /* Verde Vibrante */
            border-radius: 50px;
            padding: 18px 24px;
            border: 1px solid var(--vidro-borda);
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            text-align: left;
            cursor: pointer;
            box-shadow: 0 6px 16px rgba(0,0,0,0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .pilula-btn.azul {
            background: linear-gradient(90deg, rgba(2, 119, 189, 0.9) 0%, rgba(1, 87, 155, 0.95) 100%);
        }

        .pilula-btn.vermelho {
            background: linear-gradient(90deg, rgba(198, 40, 40, 0.9) 0%, rgba(142, 0, 0, 0.95) 100%);
        }

        .pilula-conteudo {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 20px;
            margin-top: 8px;
            margin-left: 10px;
            margin-right: 10px;
        }

        .pilula-texto {
            padding: 20px;
            font-size: 0.95rem;
            line-height: 1.6;
            color: #E2E8F0;
        }

        /* Botão Flutuante de Voltar */
        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 30px;
            padding: 10px 20px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-weight: 700;
            cursor: pointer;
            margin-bottom: 24px;
            transition: background 0.2s;
        }
        .btn-voltar:hover { background: rgba(255, 255, 255, 0.3); }

        /* Utilitários de Tela */
        .escondido { display: none !important; }
        ul, ol { padding-left: 20px; margin-top: 10px; }
        li { margin-bottom: 8px; }

    </style>
</head>
<body>

    <div class="container">
        
        <!-- ================= TELA 1: HOME ================= -->
        <div id="tela-home">
            <h1 class="titulo-principal">Bússola<br>Orientadora</h1>
            
            <div class="menu-grid">
                <!-- Botão de Emergência (Vai direto para Detalhes) -->
                <button class="btn-capsula emergencia" onclick="abrirDetalhesEmergencia()">
                    🚨 Acolhi um Relato Agora
                </button>
                
                <!-- Botões que abrem os Cards -->
                <button class="btn-capsula" onclick="abrirCategoria('acolhimento')">💜 Acolhimento Sensível</button>
                <button class="btn-capsula" onclick="abrirCategoria('fluxograma')">🗺️ Fluxograma da Rede</button>
                <button class="btn-capsula" onclick="abrirCategoria('retaguarda')">📄 Retaguarda Registral</button>
                <button class="btn-capsula" onclick="abrirCategoria('cartilha')">🎨 Cartilha Preventiva</button>
            </div>
        </div>

        <!-- ================= TELA 2: CARDS ================= -->
        <div id="tela-cards" class="escondido">
            <button class="btn-voltar" onclick="voltarParaHome()">← Voltar ao Menu</button>
            <h2 id="titulo-categoria" class="secao-titulo">Título</h2>
            
            <div id="grid-cards-dinamico" class="cards-grid">
                <!-- Cards injetados via JavaScript -->
            </div>
        </div>

        <!-- ================= TELA 3: DETALHES ================= -->
        <div id="tela-detalhes" class="escondido">
            <button class="btn-voltar" id="btn-voltar-detalhes" onclick="voltarParaCards()">← Voltar</button>
            
            <div class="detalhes-container">
                <!-- Caixa Azul Principal -->
                <div class="caixa-principal">
                    <h2 id="detalhe-titulo">Ícone + Título</h2>
                    <p id="detalhe-texto">Texto principal aqui.</p>
                </div>

                <!-- Sub-opções (Botões Cápsula Verdes/Azuis) -->
                <div id="detalhe-pilulas">
                    <!-- Injetados via JavaScript -->
                </div>
            </div>
        </div>

    </div>

    <!-- ================= MOTOR JAVASCRIPT ================= -->
    <script>
        // Banco de Dados Dinâmico do Site
        const bancoDeDados = {
            emergencia: {
                titulo: "🚨 Ação Imediata",
                textoPrincipal: "Mantenha a calma. A prioridade agora é o acolhimento, a contenção emocional e a escuta sem julgamentos. O seu papel não é investigar, mas sim proteger.",
                opcoes: [
                    { titulo: "📍 O que FAZER", cor: "verde", conteudo: "<ul><li>Escute com atenção, serenidade e empatia.</li><li>Reafirme verbalmente que a culpa NUNCA é da criança.</li><li>Garanta o sigilo. Não comente com outros alunos ou professores fora da rede de proteção.</li></ul>" },
                    { titulo: "🚫 O que NÃO FAZER", cor: "vermelho", conteudo: "<ul><li>Não faça perguntas investigativas ou invasivas.</li><li>Não revitimize: evite que a criança precise repetir a história várias vezes.</li><li>Não prometa 'segredos absolutos' que impeçam você de acionar o sistema de proteção.</li></ul>" }
                ]
            },
            acolhimento: {
                nome: "Acolhimento Sensível",
                cards: [
                    {
                        icone: "💜", 
                        titulo: "Escuta Qualificada", 
                        resumo: "Como realizar uma escuta empática sem burocratizar o afeto.",
                        textoPrincipal: "A escuta qualificada é o primeiro passo para a proteção. Consiste em criar um ambiente seguro onde a criança sinta que sua dor é validada, sem transformar o momento em um interrogatório formal.",
                        opcoes: [
                            { titulo: "🛡️ O Papel do Educador", cor: "azul", conteudo: "O educador atua como 'burocrata de nível de rua', traduzindo as políticas de proteção abstratas para a realidade do aluno através da criação de vínculos de confiança." }
                        ]
                    },
                    {
                        icone: "🧩", 
                        titulo: "Gambiarras Pedagógicas", 
                        resumo: "Criando brechas de cuidado no cotidiano do chão da escola.",
                        textoPrincipal: "Nem sempre a estrutura é ideal. As 'gambiarras pedagógicas' são ações criativas e afetuosas que os professores inventam no dia a dia para garantir que a criança se sinta vista e protegida, mesmo frente a um sistema rígido.",
                        opcoes: [
                            { titulo: "💡 Exemplos Práticos", cor: "verde", conteudo: "Atividades lúdicas, rodas de conversa adaptadas e observação sensível das mudanças de comportamento na sala de aula." }
                        ]
                    }
                ]
            },
            fluxograma: {
                nome: "Fluxograma da Rede",
                cards: [
                    {
                        icone: "🏫", titulo: "Passo 1: Gestão Escolar", resumo: "O fluxo de registro interno após o relato.",
                        textoPrincipal: "Assim que o relato é acolhido, o professor não age sozinho. O caso deve ser imediatamente levado à direção ou equipe pedagógica para registro formal da instituição.",
                        opcoes: [
                            { titulo: "📋 Procedimento", cor: "azul", conteudo: "A direção elabora a ata sigilosa e aciona a Superintendência Regional de Ensino." }
                        ]
                    },
                    {
                        icone: "⚖️", titulo: "Passo 2: Acionamento Externo", resumo: "Rede de Garantia de Direitos (SGD).",
                        textoPrincipal: "A escola atua como ponte. É dever institucional encaminhar o relato aos órgãos competentes que possuem poder de investigação e proteção legal.",
                        opcoes: [
                            { titulo: "📞 Quem acionar?", cor: "verde", conteudo: "Conselho Tutelar local, Ministério Público (Promotoria da Infância) e, em casos de emergência, as autoridades policiais via Disque 100." }
                        ]
                    }
                ]
            },
            retaguarda: {
                nome: "Retaguarda Registral",
                cards: [
                    {
                        icone: "🛡️", titulo: "Proteção ao Docente", resumo: "Blindagem jurídica do profissional de educação.",
                        textoPrincipal: "Ao realizar a notificação institucional (da escola para a rede, e não do professor pessoa física), o profissional de linha de frente tem sua identidade e segurança física resguardadas.",
                        opcoes: [
                            { titulo: "⚖️ Respaldo Legal", cor: "azul", conteudo: "O sigilo da fonte que reporta a suspeita é garantido pelo Estatuto da Criança e do Adolescente (ECA) e pela Lei da Escuta Protegida." }
                        ]
                    },
                    {
                        icone: "📝", titulo: "Modelos de Documentos", resumo: "Fichas prontas para download e preenchimento.",
                        textoPrincipal: "Padronizar o registro evita contradições e protege a criança. Utilize os formulários padronizados pela equipe.",
                        opcoes: [
                            { titulo: "⬇️ Ficha de Encaminhamento", cor: "verde", conteudo: "O link para download do arquivo PDF/Word será disponibilizado em breve." }
                        ]
                    }
                ]
            },
            cartilha: {
                nome: "Cartilha Preventiva",
                cards: [
                    {
                        icone: "📖", titulo: "Meu Corpo, Meus Limites", resumo: "Material didático para autoproteção.",
                        textoPrincipal: "Uma cartilha ilustrada, construída de forma coletiva, projetada para ajudar crianças a entenderem o próprio corpo, identificarem toques inadequados e saberem pedir ajuda.",
                        opcoes: [
                            { titulo: "👁️ Visualizar Cartilha", cor: "azul", conteudo: "O leitor interativo de PDF será integrado nesta seção nas próximas atualizações do sistema." }
                        ]
                    }
                ]
            }
        };

        // Variáveis de Estado
        let categoriaAtual = '';

        // Funções de Navegação
        function esconderTudo() {
            document.getElementById('tela-home').classList.add('escondido');
            document.getElementById('tela-cards').classList.add('escondido');
            document.getElementById('tela-detalhes').classList.add('escondido');
        }

        function voltarParaHome() {
            esconderTudo();
            document.getElementById('tela-home').classList.remove('escondido');
        }

        function voltarParaCards() {
            if(categoriaAtual === 'emergencia') {
                voltarParaHome(); // Se veio da emergência, volta pra Home direto
            } else {
                esconderTudo();
                document.getElementById('tela-cards').classList.remove('escondido');
            }
        }

        function abrirCategoria(chave) {
            categoriaAtual = chave;
            const dados = bancoDeDados[chave];
            
            document.getElementById('titulo-categoria').innerText = dados.nome;
            const gridCards = document.getElementById('grid-cards-dinamico');
            gridCards.innerHTML = ''; // Limpa cards anteriores

            // Monta os Cards
            dados.cards.forEach((card, index) => {
                const cardHTML = `
                    <div class="card-vidro" onclick="abrirDetalhesCard(${index})">
                        <div class="card-topo">${card.icone}</div>
                        <div class="card-conteudo">
                            <h3 class="card-titulo">${card.titulo}</h3>
                            <p class="card-resumo">${card.resumo}</p>
                        </div>
                    </div>
                `;
                gridCards.innerHTML += cardHTML;
            });

            esconderTudo();
            document.getElementById('tela-cards').classList.remove('escondido');
        }

        function renderizarTelaDetalhes(titulo, icone, textoPrincipal, opcoes, veioDeEmergencia) {
            document.getElementById('detalhe-titulo').innerHTML = `${icone} ${titulo}`;
            document.getElementById('detalhe-texto').innerHTML = textoPrincipal;
            
            const containerPilulas = document.getElementById('detalhe-pilulas');
            containerPilulas.innerHTML = '';

            // Monta as Cápsulas de sub-opções
            opcoes.forEach((opcao, idx) => {
                let classeCor = '';
                if(opcao.cor === 'azul') classeCor = 'azul';
                if(opcao.cor === 'vermelho') classeCor = 'vermelho';

                const pilulaHTML = `
                    <div class="pilula-container">
                        <button class="pilula-btn ${classeCor}" onclick="alternarPilula('pilula-${idx}')">
                            ${opcao.titulo} <span>▼</span>
                        </button>
                        <div id="pilula-${idx}" class="pilula-conteudo">
                            <div class="pilula-texto">${opcao.conteudo}</div>
                        </div>
                    </div>
                `;
                containerPilulas.innerHTML += pilulaHTML;
            });

            esconderTudo();
            document.getElementById('tela-detalhes').classList.remove('escondido');
        }

        function abrirDetalhesCard(index) {
            const card = bancoDeDados[categoriaAtual].cards[index];
            renderizarTelaDetalhes(card.titulo, card.icone, card.textoPrincipal, card.opcoes, false);
        }

        function abrirDetalhesEmergencia() {
            categoriaAtual = 'emergencia';
            const dados = bancoDeDados.emergencia;
            renderizarTelaDetalhes(dados.titulo, "", dados.textoPrincipal, dados.opcoes, true);
        }

        // Lógica de sanfona independente (sem auto-fechar as outras)
        function alternarPilula(id) {
            const conteudo = document.getElementById(id);
            if (conteudo.style.maxHeight) {
                conteudo.style.maxHeight = null;
            } else {
                conteudo.style.maxHeight = conteudo.scrollHeight + "px";
            }
        }
    </script>
</body>
</html>
