<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bússola Orientadora</title>
    
    <!-- Fontes do Google -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">
    
    <style>
        /* === Variáveis de Cores (Ultra Translúcido) e Efeitos === */
        :root {
            /* Tons muito mais transparentes para destacar o fundo e o "Vidro Líquido" */
            --roxo-claro: rgba(190, 128, 255, 0.25);
            --roxo-escuro: rgba(120, 60, 180, 0.35);
            --ciano-claro: rgba(99, 211, 255, 0.25);
            --ciano-escuro: rgba(40, 140, 190, 0.35);
            --emergencia-claro: rgba(220, 50, 60, 0.4);
            --emergencia-escuro: rgba(150, 20, 30, 0.5);
            
            /* Efeito iOS 27 Liquid Glass Aprimorado */
            --vidro-blur: blur(30px);
            --vidro-borda: rgba(255, 255, 255, 0.15);
            --vidro-topo: rgba(255, 255, 255, 0.4);
            --vidro-esquerda: rgba(255, 255, 255, 0.2);
            --sombra-vidro: 0 16px 40px rgba(0, 0, 0, 0.3), inset 0 2px 20px rgba(255, 255, 255, 0.15);
            
            --texto-branco: #FFFFFF;
        }

        /* Configuração Base */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Inter', sans-serif;
            color: var(--texto-branco);
            min-height: 100vh;
            background: linear-gradient(135deg, #0F172A, #1E1E38); /* Fallback elegante */
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
        }

        /* Fundo Travado: Mantido o nome das imagens originais */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('fundo-bussola-blur-desktop.png') center/cover no-repeat;
            z-index: -1;
            filter: brightness(0.8) contrast(1.1);
        }

        @media (max-aspect-ratio: 1/1) {
            body::before {
                background: url('fundo-bussola-blur-mobile.png') center/cover no-repeat;
            }
        }

        /* Container Principal - Layout Retrato Corrigido */
        .container {
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Centraliza tudo verticalmente */
            align-items: center;
            position: relative;
        }

        /* === TÍTULO DINÂMICO === */
        @keyframes pulseGlow {
            0% { text-shadow: 0 0 15px rgba(190, 128, 255, 0.6), 0 0 30px rgba(99, 211, 255, 0.4); }
            50% { text-shadow: 0 0 25px rgba(190, 128, 255, 0.9), 0 0 50px rgba(99, 211, 255, 0.7); }
            100% { text-shadow: 0 0 15px rgba(190, 128, 255, 0.6), 0 0 30px rgba(99, 211, 255, 0.4); }
        }

        .titulo-principal {
            font-family: 'Outfit', sans-serif;
            font-size: clamp(3rem, 10vw, 5rem);
            font-weight: 900;
            text-align: center;
            line-height: 1.1;
            color: var(--texto-branco);
            animation: pulseGlow 4s infinite alternate;
            margin-bottom: 40px;
            letter-spacing: 1px;
            width: 100%;
        }

        /* === NÍVEL 1: TELA INICIAL (BOTÕES "GORDINHOS" TRANSLÚCIDOS) === */
        .menu-grid {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            width: 100%;
        }

        .btn-capsula {
            width: 100%;
            max-width: 360px;
            padding: 22px 24px;
            border-radius: 50px;
            border: 1px solid var(--vidro-borda);
            border-top: 1px solid var(--vidro-topo);
            border-left: 1px solid var(--vidro-esquerda);
            color: var(--texto-branco);
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: var(--sombra-vidro);
            backdrop-filter: var(--vidro-blur);
            -webkit-backdrop-filter: var(--vidro-blur);
            cursor: pointer;
            transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), filter 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
        }

        .btn-capsula:hover, .btn-capsula:active {
            transform: scale(1.05) translateY(-2px);
            filter: brightness(1.15);
        }

        /* Cores Alternadas e Emergência - Versão Cristalina */
        .tema-roxo { background: linear-gradient(145deg, var(--roxo-claro), var(--roxo-escuro)); }
        .tema-ciano { background: linear-gradient(145deg, var(--ciano-claro), var(--ciano-escuro)); }
        .btn-capsula.emergencia {
            background: linear-gradient(145deg, var(--emergencia-claro), var(--emergencia-escuro));
            margin-bottom: 12px;
            border-top: 1px solid rgba(255, 100, 100, 0.7);
        }

        /* === NÍVEL 2: TELA DE CARDS === */
        #tela-cards, #tela-detalhes {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .secao-titulo {
            font-family: 'Outfit', sans-serif;
            text-align: center;
            color: var(--texto-branco);
            font-size: 2.2rem;
            margin-bottom: 30px;
            text-shadow: 0 4px 15px rgba(190, 128, 255, 0.8);
        }

        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 24px;
            width: 100%;
            max-width: 900px;
        }

        .card-vidro {
            backdrop-filter: var(--vidro-blur);
            -webkit-backdrop-filter: var(--vidro-blur);
            border-radius: 28px;
            border: 1px solid var(--vidro-borda);
            border-top: 1px solid var(--vidro-topo);
            border-left: 1px solid var(--vidro-esquerda);
            box-shadow: var(--sombra-vidro);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
        }

        .card-vidro:hover, .card-vidro:active { transform: translateY(-10px); }

        .card-topo {
            height: 140px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4.5rem;
            background: rgba(255, 255, 255, 0.05); /* Fundo sutil para destacar ícone no vidro */
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .card-conteudo { padding: 24px; }

        .card-titulo {
            font-family: 'Outfit', sans-serif;
            color: var(--texto-branco);
            font-size: 1.5rem;
            margin-bottom: 10px;
            text-shadow: 0 2px 5px rgba(0,0,0,0.4);
        }

        .card-resumo {
            font-size: 1rem;
            color: rgba(255,255,255,0.9);
            line-height: 1.5;
            font-weight: 500;
        }

        /* === NÍVEL 3: TELA DE DETALHES === */
        .detalhes-container { width: 100%; max-width: 800px; margin: 0 auto; }

        .caixa-principal {
            /* Caixa mais transparente e elegante */
            background: linear-gradient(145deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.2));
            backdrop-filter: var(--vidro-blur);
            -webkit-backdrop-filter: var(--vidro-blur);
            border-radius: 28px;
            padding: 35px 30px;
            border: 1px solid var(--vidro-borda);
            border-top: 1px solid var(--vidro-topo);
            border-left: 1px solid var(--vidro-esquerda);
            box-shadow: var(--sombra-vidro);
            margin-bottom: 24px;
        }

        .caixa-principal h2 {
            font-family: 'Outfit', sans-serif;
            color: var(--texto-branco);
            margin-bottom: 16px;
            font-size: 2rem;
            display: flex;
            align-items: center;
            gap: 12px;
            text-shadow: 0 3px 8px rgba(0,0,0,0.5);
        }

        .caixa-principal p {
            font-size: 1.1rem;
            line-height: 1.7;
            color: rgba(255,255,255,0.95);
            font-weight: 400;
        }

        /* Botões Acordeão (Pílulas) */
        .pilula-container { margin-bottom: 16px; }

        .pilula-btn {
            width: 100%;
            border-radius: 30px;
            padding: 20px 24px;
            border: 1px solid var(--vidro-borda);
            border-top: 1px solid var(--vidro-topo);
            border-left: 1px solid var(--vidro-esquerda);
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1.15rem;
            font-weight: 800;
            text-align: left;
            cursor: pointer;
            box-shadow: var(--sombra-vidro);
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-shadow: 0 2px 4px rgba(0,0,0,0.6);
            backdrop-filter: var(--vidro-blur);
            -webkit-backdrop-filter: var(--vidro-blur);
        }

        .seta {
            transition: transform 0.3s ease;
            font-size: 1rem;
        }
        .pilula-btn.aberto .seta { transform: rotate(180deg); }

        .pilula-conteudo {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0, 1, 0.5, 1);
            background: rgba(0, 0, 0, 0.25); /* Fundo mais escuro para o texto no acordeão */
            border-radius: 20px;
            margin-top: 8px;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.2);
            backdrop-filter: blur(10px);
        }

        .pilula-texto {
            padding: 24px;
            font-size: 1.05rem;
            line-height: 1.7;
            color: rgba(255,255,255,0.95);
        }

        .pilula-texto a {
            color: var(--ciano-claro);
            font-weight: 700;
            text-decoration: none;
        }

        /* Botão Flutuante de Voltar */
        .btn-voltar {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-top: 1px solid rgba(255,255,255,0.4);
            border-radius: 40px;
            padding: 12px 24px;
            color: white;
            font-family: 'Outfit', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            margin-bottom: 24px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: all 0.2s;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
            align-self: flex-start;
        }
        .btn-voltar:hover { transform: scale(1.05); background: rgba(255, 255, 255, 0.15); }
        .btn-voltar.tema-roxo { background: var(--roxo-claro); }
        .btn-voltar.tema-ciano { background: var(--ciano-claro); }

        /* Utilitários */
        .escondido { display: none !important; }
        ul, ol { padding-left: 20px; margin-top: 10px; }
        li { margin-bottom: 12px; }

    </style>
</head>
<body>

    <div class="container">
        
        <!-- ================= TELA 1: HOME ================= -->
        <div id="tela-home">
            <h1 class="titulo-principal">Bússola<br>Orientadora</h1>
            
            <div class="menu-grid">
                <!-- Botão de Emergência -->
                <button class="btn-capsula emergencia" onclick="interagir(() => abrirDetalhesEmergencia())">
                    🚨 Acolhi um Relato Agora
                </button>
                
                <!-- Botões com cores intercaladas e translúcidas -->
                <button class="btn-capsula tema-roxo" onclick="interagir(() => abrirCategoria('acolhimento'))">
                    💜 Acolhimento Sensível
                </button>
                <button class="btn-capsula tema-ciano" onclick="interagir(() => abrirCategoria('fluxograma'))">
                    🗺️ Fluxograma da Rede
                </button>
                <button class="btn-capsula tema-roxo" onclick="interagir(() => abrirCategoria('retaguarda'))">
                    📄 Retaguarda Registral
                </button>
                <button class="btn-capsula tema-ciano" onclick="interagir(() => abrirCategoria('cartilha'))">
                    🎨 Cartilha Preventiva
                </button>
            </div>
        </div>

        <!-- ================= TELA 2: CARDS ================= -->
        <div id="tela-cards" class="escondido">
            <button class="btn-voltar tema-roxo" onclick="interagir(() => voltarParaHome())">← Voltar ao Menu</button>
            <h2 id="titulo-categoria" class="secao-titulo">Título</h2>
            
            <div id="grid-cards-dinamico" class="cards-grid">
                <!-- Cards injetados via JavaScript -->
            </div>
        </div>

        <!-- ================= TELA 3: DETALHES ================= -->
        <div id="tela-detalhes" class="escondido">
            <button class="btn-voltar tema-ciano" id="btn-voltar-detalhes" onclick="interagir(() => voltarParaCards())">← Voltar</button>
            
            <div class="detalhes-container">
                <div class="caixa-principal">
                    <h2 id="detalhe-titulo">Ícone + Título</h2>
                    <p id="detalhe-texto">Texto principal aqui.</p>
                </div>

                <div id="detalhe-pilulas">
                    <!-- Injetados via JavaScript -->
                </div>
            </div>
        </div>

    </div>

    <!-- ================= MOTOR JAVASCRIPT ================= -->
    <script>
        // Função para ativar Tela Cheia em qualquer interação
        function acionarTelaCheia() {
            if (!document.fullscreenElement) {
                document.documentElement.requestFullscreen().catch(err => {
                    console.log(`Erro ao tentar tela cheia: ${err.message}`);
                });
            }
        }

        // Wrapper de interação para garantir o Fullscreen
        function interagir(callback) {
            acionarTelaCheia();
            callback();
            window.scrollTo({ top: 0, behavior: 'smooth' }); // Scroll Reset
        }

        // Banco de Dados Dinâmico Totalmente Limpo
        const bancoDeDados = {
            emergencia: {
                titulo: "Ação Imediata",
                textoPrincipal: "Mantenha a calma. A prioridade agora é o acolhimento, a contenção emocional e a escuta sem julgamentos. O seu papel como educador não é investigar, mas sim acolher e proteger.",
                opcoes: [
                    { titulo: "📍 O que FAZER", conteudo: "<ul><li><strong>Escute com atenção:</strong> Valide a dor da criança sem transformar o momento em um interrogatório formal.</li><li><strong>Pactuação Ética:</strong> Reafirme verbalmente que a culpa NUNCA é da criança.</li><li><strong>Garanta a Contenção Emocional:</strong> Transmita segurança. O corpo do professor atua como abrigo.</li></ul>" },
                    { titulo: "🚫 O que NÃO FAZER (Risco de Revitimização)", conteudo: "<ul><li>Não faça perguntas investigativas, indutivas ou invasivas.</li><li>Não revitimize: evite que a criança precise repetir a história para várias pessoas na escola.</li><li>Não prometa 'segredos absolutos' que impeçam você de acionar o sistema de garantia de direitos.</li></ul>" }
                ]
            },
            acolhimento: {
                nome: "Acolhimento Sensível",
                cards: [
                    {
                        icone: "💜", titulo: "Escuta Qualificada", resumo: "Realizando a escuta sem burocratizar o afeto.",
                        textoPrincipal: "A escuta qualificada é o primeiro passo para a proteção. Consiste em criar um ambiente seguro onde a criança sinta que sua dor é validada, ancorado na Pedagogia Engajada (bell hooks, 2019), onde o corpo docente atua nas trincheiras das vulnerabilidades.",
                        opcoes: [
                            { titulo: "🛡️ O Burocrata de Nível de Rua", conteudo: "Na linha de frente (Lipsky, 2010), o educador traduz políticas abstratas de proteção para a vida real do aluno, exercendo margem de discricionariedade para responder às urgências humanas." }
                        ]
                    },
                    {
                        icone: "🧩", titulo: "Gambiarras Pedagógicas", resumo: "Táticas inventivas e afetuosas nas frestas da escola.",
                        textoPrincipal: "Nem sempre a estrutura é ideal. As 'Gambiarras Pedagógicas' (Alves, 2025) são táticas artesanais, afetuosas e criativas inventadas no cotidiano para garantir escuta e cuidado onde a norma fria não chega.",
                        opcoes: [
                            { titulo: "💡 O Inédito Viável", conteudo: "Longe de ser precariedade, a gambiarra produz brechas de acolhimento e saídas coletivas no chão da escola para enfrentar situações-limite sem engessar a relação pedagógica." }
                        ]
                    }
                ]
            },
            fluxograma: {
                nome: "Fluxograma da Rede",
                cards: [
                    {
                        icone: "🏫", titulo: "Passo 1: Gestão Escolar", resumo: "O registro institucional que protege o docente.",
                        textoPrincipal: "Você não age sozinho/a. Para evitar exposição e solidão, o relato deve ser levado imediatamente à Direção. A notificação deve ser um ato da instituição escolar, e não do professor (pessoa física).",
                        opcoes: [
                            { titulo: "📋 Acionamento Regional", conteudo: "A Direção elabora a ata sigilosa e aciona a Superintendência Regional de Ensino (SRE Metropolitana) para mediação." }
                        ]
                    },
                    {
                        icone: "⚖️", titulo: "Passo 2: O Sistema de Garantia (SGD)", resumo: "Encaminhamento aos órgãos de proteção legal.",
                        textoPrincipal: "A escola atua como ponte. Sem investigar, a escola deve encaminhar o caso a quem tem poder legal de averiguação, compondo o mapa de pistas sensíveis sem anular o chão da escola.",
                        opcoes: [
                            { titulo: "📞 Rede de Contatos", conteudo: "<ul><li><strong>Conselho Tutelar:</strong> Para medidas imediatas de proteção.</li><li><strong>Ministério Público:</strong> Promotoria da Infância e Juventude para retaguarda judicial.</li><li><strong>Disque 100:</strong> Em casos de urgência extrema.</li></ul>" }
                        ]
                    }
                ]
            },
            retaguarda: {
                nome: "Retaguarda Registral",
                cards: [
                    {
                        icone: "🛡️", titulo: "Proteção Jurídica do Docente", resumo: "Blindagem do profissional contra retaliações.",
                        textoPrincipal: "Ao adotar a Bússola Orientadora, a notificação passa a ter um fluxo claro. Isso evita o medo de represálias e a paralisia docente diante do imprevisível.",
                        opcoes: [
                            { titulo: "⚖️ Estatuto e Escuta Protegida", conteudo: "A Lei nº 13.431/2017 (Lei da Escuta Protegida) e o ECA garantem o sigilo absoluto da fonte (do/a profissional) que reporta a suspeita, resguardando sua integridade." }
                        ]
                    },
                    {
                        icone: "📝", titulo: "Caderno de Registros", resumo: "Documentação padronizada e sigilosa.",
                        textoPrincipal: "Padronizar o registro por meio de formulários evita contradições e protege tanto a vítima quanto a equipe escolar, servindo como retaguarda institucional.",
                        opcoes: [
                            { titulo: "⬇️ Fichas de Encaminhamento", conteudo: "Os modelos flexíveis de registro sigiloso da Bússola serão integrados em breve para download." }
                        ]
                    }
                ]
            },
            cartilha: {
                nome: "Cartilha Preventiva",
                cards: [
                    {
                        icone: "📖", titulo: "Meu Corpo, Meus Limites", resumo: "Invenção pedagógica em coautoria discente.",
                        textoPrincipal: "Uma cartilha de combate ao abuso construída em coautoria entre uma professora e estudantes do Ensino Médio, validada por profissionais do Sistema de Justiça.",
                        opcoes: [
                            { titulo: "🎨 Pistas Metodológicas", conteudo: "A cartilha utiliza desenhos lúdicos e linguagem sensível para ensinar crianças do Ensino Fundamental sobre autoproteção corporais, rompendo a cegueira e os 'pânicos morais' da escola." }
                        ]
                    }
                ]
            }
        };

        let categoriaAtual = '';

        function esconderTudo() {
            document.getElementById('tela-home').classList.add('escondido');
            document.getElementById('tela-cards').classList.add('escondido');
            document.getElementById('tela-detalhes').classList.add('escondido');
        }

        function voltarParaHome() {
            esconderTudo();
            document.getElementById('tela-home').classList.remove('escondido');
        }

        function voltarParaCards() {
            if(categoriaAtual === 'emergencia') {
                voltarParaHome();
            } else {
                esconderTudo();
                document.getElementById('tela-cards').classList.remove('escondido');
            }
        }

        function abrirCategoria(chave) {
            categoriaAtual = chave;
            const dados = bancoDeDados[chave];
            
            document.getElementById('titulo-categoria').innerText = dados.nome;
            const gridCards = document.getElementById('grid-cards-dinamico');
            gridCards.innerHTML = '';

            dados.cards.forEach((card, index) => {
                // Intercala cores nos cards translúcidos
                const classeCor = (index % 2 === 0) ? 'tema-roxo' : 'tema-ciano';
                
                const cardHTML = `
                    <div class="card-vidro ${classeCor}" onclick="interagir(() => abrirDetalhesCard(${index}))">
                        <div class="card-topo">${card.icone}</div>
                        <div class="card-conteudo">
                            <h3 class="card-titulo">${card.titulo}</h3>
                            <p class="card-resumo">${card.resumo}</p>
                        </div>
                    </div>
                `;
                gridCards.innerHTML += cardHTML;
            });

            esconderTudo();
            document.getElementById('tela-cards').classList.remove('escondido');
        }

        function renderizarTelaDetalhes(titulo, icone, textoPrincipal, opcoes, veioDeEmergencia) {
            document.getElementById('detalhe-titulo').innerHTML = `${icone} ${titulo}`;
            document.getElementById('detalhe-texto').innerHTML = textoPrincipal;
            
            const containerPilulas = document.getElementById('detalhe-pilulas');
            containerPilulas.innerHTML = '';

            opcoes.forEach((opcao, idx) => {
                let classeCor = (idx % 2 === 0) ? 'tema-roxo' : 'tema-ciano';

                const pilulaHTML = `
                    <div class="pilula-container">
                        <button class="pilula-btn ${classeCor}" id="btn-pilula-${idx}" onclick="interagir(() => alternarPilula(${idx}))">
                            ${opcao.titulo} <span class="seta">▼</span>
                        </button>
                        <div id="conteudo-pilula-${idx}" class="pilula-conteudo">
                            <div class="pilula-texto">${opcao.conteudo}</div>
                        </div>
                    </div>
                `;
                containerPilulas.innerHTML += pilulaHTML;
            });

            esconderTudo();
            document.getElementById('tela-detalhes').classList.remove('escondido');
        }

        function abrirDetalhesCard(index) {
            const card = bancoDeDados[categoriaAtual].cards[index];
            renderizarTelaDetalhes(card.titulo, card.icone, card.textoPrincipal, card.opcoes, false);
        }

        function abrirDetalhesEmergencia() {
            categoriaAtual = 'emergencia';
            const dados = bancoDeDados.emergencia;
            renderizarTelaDetalhes(dados.titulo, "🚨", dados.textoPrincipal, dados.opcoes, true);
        }

        function alternarPilula(idx) {
            const btn = document.getElementById(`btn-pilula-${idx}`);
            const conteudo = document.getElementById(`conteudo-pilula-${idx}`);
            
            if (conteudo.style.maxHeight) {
                conteudo.style.maxHeight = null;
                btn.classList.remove('aberto');
            } else {
                conteudo.style.maxHeight = conteudo.scrollHeight + "px";
                btn.classList.add('aberto');
            }
        }
    </script>
</body>
</html>
